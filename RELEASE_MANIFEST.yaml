resolved_release_questions:
  - id: branding_restore
    resolution: OpenFlexure identity and attribution are retained; the retired private name is absent from all release trees and metadata.
  - id: white_gate_truth
    resolution: Observed live PB14 is the accepted prototype profile; PB13 remains labelled as a legacy unverified candidate.
  - id: arduino_version_truth
    resolution: Deployed Arduino v4 is preserved as the accepted reference; later candidates are separated and do not define the release claim.
  - id: public_snapshot_sanitization
    resolution: Release trees were rebuilt without prior Git history and passed retired-name, private-path, credential-pattern and unexpected-generated-artifact scans.

deferred_validation:
  - id: pi_platform_identity
    description: The owner records the measured scan on Raspberry Pi 4 and the current deployment on Raspberry Pi 5, but exact board, OS image and kernel were unavailable for recapture and no matched Pi 5 timing exists; ARM64 Debian/Python validation is recorded separately and is not represented as Raspberry Pi OS validation.
  - id: specimen_replay_fixture
    description: No specimen imagery is shipped in this source-only release candidate; a privacy-reviewed image replay dataset and derived public figures remain a later publication task.
  - id: bounded_hardware_smoke_test
    description: Requires an owner-present hardware session and is not automated or implied by source validation.
