name: Bug report
description: Report a reproducible Fast OFM prototype defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, patient data, private addresses, or unpublished specimen images.
  - type: input
    id: release
    attributes:
      label: Release tag or commit
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature ID
      description: Use FEATURE_INDEX.md when possible.
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal safe reproduction
    validations:
      required: true
